{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<h4 class="mb-3">{% trans "Request a Book" %}</h4>
<p class="text-muted">{% trans "Can't find what you're looking for? Post it here and sellers who have it will get notified." %}</p>
<form method="post" class="card p-3">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-2">
        <label class="form-label small">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <button class="btn btn-warning text-dark fw-semibold">{% trans "Post Request" %}</button>
</form>
<script nonce="{{ csp_nonce }}">
document.querySelectorAll('input, textarea').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
